[package]
name = "dotrift"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
indexmap = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
color-eyre = "0.6"
thiserror = "2.0.18"
glob = "0.3.3"
ignore = "0.4.25"
normalize-path = "0.2"
walkdir = "2"
twox-hash = "2.1"

[dev-dependencies]
tempfile = "3"
test-case = "3"
